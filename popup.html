<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><link rel="stylesheet" href="styles.css"></head>
<body class="popup">
  <div id="warning" class="warn" hidden></div>
  <header><strong id="title">Script Manager</strong><span><button id="newScript" class="primary" title="Crear un script nuevo">+ Nuevo</button> <button id="openOptions">Gestionar</button></span></header>
  <div class="bar"><button id="runAll" class="primary">▶ Ejecutar todos los activos</button>
    <div id="opts"></div>
  </div>
  <div class="tools">
    <button id="exportAll" title="Exportar todos los scripts a un archivo JSON">⬇ Exportar</button>
    <button id="importBtn" title="Importar scripts desde JSON o .js">⬆ Importar</button>
    <button id="toggleAll" title="Contraer o desplegar todos los grupos">⊟ Contraer todo</button>
    <input id="importFile" type="file" accept=".json,.js,application/json" multiple hidden>
  </div>
  <div id="msg" class="ok" hidden></div>
  <form id="newForm" class="newform" hidden>
    <input id="newName" type="text" placeholder="Nombre del script" required>
    <input id="newMatches" type="text" placeholder="Patrón de URL (ej. https://*.example.com/*)">
    <textarea id="newCode" spellcheck="false" placeholder="Código del script"></textarea>
    <div class="row"><button type="submit" class="primary">Crear</button><button type="button" id="newCancel">Cancelar</button></div>
  </form>
  <ul id="list"></ul>
  <script type="module" src="popup.js"></script>
</body>
</html>
