<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><title>Script Manager</title><link rel="stylesheet" href="styles.css"></head>
<body>
  <div class="layout">
    <aside class="sidebar">
      <div class="side-head">
        <strong>Scripts</strong>
        <span>
          <button id="newScript" class="primary">+ Nuevo</button>
          <button id="newGroup" title="Crea un grupo; si hay scripts seleccionados, los mueve a él">+ Grupo</button>
        </span>
      </div>
      <div class="side-tools">
        <input id="search" type="search" placeholder="Buscar por nombre o patrón…">
        <label>Ordenar <select id="sortMode"></select></label>
        <label>Tema <select id="themeSelect"></select></label>
        <button id="exportAll">⬇ Exportar todos</button>
        <button id="importBtn">⬆ Importar</button>
        <input id="importFile" type="file" accept=".json,.js,application/json" multiple hidden>
      </div>
      <div class="list-bar">
        <label><input id="selectAll" type="checkbox"> Seleccionar todos</label>
        <span id="selCount"></span>
      </div>
      <div id="bulkBar" class="bulk" hidden>
        <strong id="bulkCount"></strong>
        <select id="bulkGroup"></select>
        <button id="bulkOn">Activar</button>
        <button id="bulkOff">Desactivar</button>
        <button id="bulkClear">Limpiar</button>
        <button id="bulkDelete" class="danger">Eliminar</button>
      </div>
      <div id="items"></div>
      <div class="hint">Arrastra un script para ordenarlo o moverlo a un grupo · Ctrl/Mayús + clic para seleccionar varios · Esc limpia la selección</div>
    </aside>
    <main class="editor">
      <div id="warning" class="warn" hidden></div>
      <div id="message" hidden></div>
      <div class="row two">
        <label>Nombre<input id="name" type="text"></label>
        <label>Grupo<select id="group"></select></label>
      </div>
      <label>Patrones de URL (uno por línea, ej. https://*.example.com/*)<textarea id="matches" rows="3"></textarea></label>
      <label>Permisos de extensión (@grant, separados por comas; <code>*</code> = todos)
        <input id="grants" type="text" placeholder="GM_openInTab, GM_xmlhttpRequest, GM_setValue, GM_getValue">
      </label>
      <label>Código <small>(API: <code>ScriptManager.mount(elemento, { title, id })</code> agrupa componentes flotantes)</small>
        <textarea id="code" class="code" spellcheck="false"></textarea>
      </label>
      <label>Nota de versión (opcional) <input id="note" type="text" placeholder="Qué cambió en esta versión"></label>
      <label class="inline"><input id="enabled" type="checkbox"> Activo</label>
      <div class="row">
        <button id="save" class="primary">Guardar</button>
        <button id="readHeader">Leer cabecera ==UserScript==</button>
        <button id="duplicate">Duplicar</button>
        <button id="copyScript">Copiar</button>
        <button id="exportOne">Exportar este</button>
        <button id="remove" class="danger">Eliminar</button>
      </div>
      <details id="historyBox">
        <summary>Historial de versiones (<span id="historyCount">0</span>)</summary>
        <div id="historyList"></div>
        <div id="diffView" class="diff" hidden></div>
      </details>
    </main>
  </div>
  <script type="module" src="options.js"></script>
</body>
</html>
